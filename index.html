<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #09090b;
    --card: #111113;
    --border: #212124;
    --fg: #fafafa;
    --muted: #71717a;
    --muted-fg: #a1a1aa;
    --ring: #27272a;
    --accent: #10b981;
    --accent-fg: #052e22;
    --danger: #ef4444;
    --warn: #f59e0b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    background-image: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.04), transparent 60%);
    color: var(--fg);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 1.5rem;
  }
  .card {
    width: 100%;
    max-width: 360px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2rem;
    box-shadow: 0 1px 2px rgba(0,0,0,0.4), 0 20px 50px -20px rgba(0,0,0,0.6);
  }

  /* lock icon */
  .icon-wrap {
    width: 40px; height: 40px;
    border-radius: 10px;
    background: var(--ring);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 1.25rem;
  }
  .icon-wrap svg { width: 18px; height: 18px; stroke: var(--muted-fg); }

  label {
    display: block;
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--muted-fg);
    margin-bottom: 0.4rem;
  }
  input {
    width: 100%;
    font-family: inherit;
    font-size: 0.9rem;
    padding: 0.6rem 0.75rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #18181b;
    color: var(--fg);
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input::placeholder { color: var(--muted); }
  input:focus {
    border-color: #3f3f46;
    box-shadow: 0 0 0 3px rgba(255,255,255,0.06);
  }

  button {
    width: 100%;
    font-family: inherit;
    font-size: 0.875rem;
    font-weight: 500;
    padding: 0.6rem 1rem;
    border-radius: 8px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: opacity 0.15s, background-color 0.15s;
  }
  button:active { transform: translateY(0.5px); }
  button:disabled { cursor: not-allowed; opacity: 0.5; }

  .btn-primary { background: var(--fg); color: #09090b; }
  .btn-primary:hover:not(:disabled) { opacity: 0.88; }

  .btn-accent { background: var(--accent); color: var(--accent-fg); }
  .btn-accent:hover:not(:disabled) { opacity: 0.88; }

  .btn-secondary { background: transparent; color: var(--fg); border-color: var(--border); }
  .btn-secondary:hover:not(:disabled) { background: var(--ring); }

  .stack > * + * { margin-top: 0.7rem; }

  #lockError {
    color: var(--danger);
    font-size: 0.8rem;
    min-height: 1rem;
    margin-top: 0.6rem;
    text-align: center;
  }

  .main-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.25rem;
  }
  .main-header .title { font-size: 0.95rem; font-weight: 600; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.25rem 0.65rem;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 500;
    border: 1px solid var(--border);
    background: var(--ring);
    color: var(--muted-fg);
  }
  .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted-fg); }
  .badge.running { color: #6ee7b7; border-color: rgba(16,185,129,0.3); background: rgba(16,185,129,0.08); }
  .badge.running .dot { background: #34d399; box-shadow: 0 0 0 3px rgba(16,185,129,0.15); }
  .badge.pending, .badge.stopping { color: #fcd34d; border-color: rgba(245,158,11,0.3); background: rgba(245,158,11,0.08); }
  .badge.pending .dot, .badge.stopping .dot { background: var(--warn); box-shadow: 0 0 0 3px rgba(245,158,11,0.15); animation: pulse 1.2s ease-in-out infinite; }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  #ipBox {
    display: none;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.85rem;
    background: #18181b;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.6rem 0.75rem;
    margin-bottom: 0.9rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
  }
  #ipBox .ip-label { color: var(--muted-fg); font-family: inherit; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.04em; }
  #ipBox .ip-val { color: var(--fg); }

  #statusText {
    margin-top: 0.75rem;
    font-size: 0.8rem;
    color: var(--muted-fg);
    text-align: center;
    min-height: 1rem;
  }
</style>
</head>
<body>

<div class="card" id="lockScreen">
  <div class="icon-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2"></rect>
      <path d="M7 11V7a5 5 0 0110 0v4"></path>
    </svg>
  </div>
  <div class="stack">
    <input type="password" id="pwInput" placeholder="Password" autocomplete="off">
    <button class="btn-primary" id="unlockBtn">Continue</button>
  </div>
  <div id="lockError"></div>
</div>

<div class="card" id="mainScreen" style="display:none">
  <div class="main-header">
    <span class="title">Server</span>
    <span class="badge off" id="badge"><span class="dot"></span>Checking</span>
  </div>
  <div id="ipBox"><span class="ip-label">Address</span><span class="ip-val" id="ipVal"></span></div>
  <div class="stack">
    <button class="btn-accent" id="startBtn" disabled>Start</button>
    <button class="btn-secondary" id="checkBtn">Check status</button>
  </div>
  <div id="statusText"></div>
</div>

<script>
  const API_URL = "https://hntkhbcqv4.execute-api.us-east-2.amazonaws.com/";
  let TOKEN = sessionStorage.getItem("mc_pw") || "";

  const lockScreen = document.getElementById("lockScreen");
  const mainScreen = document.getElementById("mainScreen");
  const pwInput = document.getElementById("pwInput");
  const unlockBtn = document.getElementById("unlockBtn");
  const lockError = document.getElementById("lockError");
  const badge = document.getElementById("badge");
  const ipBox = document.getElementById("ipBox");
  const ipVal = document.getElementById("ipVal");
  const startBtn = document.getElementById("startBtn");
  const checkBtn = document.getElementById("checkBtn");
  const statusText = document.getElementById("statusText");

  function render(state, ip) {
    badge.className = "badge " + (state || "off");
    if (state === "running") {
      badge.innerHTML = '<span class="dot"></span>Running';
      startBtn.disabled = true;
      startBtn.textContent = "Running";
      if (ip) {
        ipBox.style.display = "flex";
        ipVal.textContent = ip + ":25565";
      }
      statusText.textContent = "";
    } else if (state === "pending") {
      badge.innerHTML = '<span class="dot"></span>Starting';
      startBtn.disabled = true;
      startBtn.textContent = "Starting…";
      ipBox.style.display = "none";
      statusText.textContent = "Usually takes 1–2 minutes.";
    } else if (state === "stopping") {
      badge.innerHTML = '<span class="dot"></span>Stopping';
      startBtn.disabled = true;
      startBtn.textContent = "Stopping…";
      ipBox.style.display = "none";
      statusText.textContent = "";
    } else {
      badge.innerHTML = '<span class="dot"></span>Offline';
      startBtn.disabled = false;
      startBtn.textContent = "Start";
      ipBox.style.display = "none";
      statusText.textContent = "Nobody's playing right now.";
    }
  }

  async function poll(action) {
    try {
      const res = await fetch(`${API_URL}?action=${action}&token=${encodeURIComponent(TOKEN)}`);
      if (res.status === 403) {
        if (mainScreen.style.display !== "none") {
          sessionStorage.removeItem("mc_pw");
          showLock("Session expired.");
        } else {
          lockError.textContent = "Incorrect password.";
        }
        return false;
      }
      const data = await res.json();
      showMain();
      render(data.state, data.public_ip);
      return true;
    } catch (e) {
      statusText.textContent = "Could not reach server.";
      return false;
    }
  }

  function showMain() {
    lockScreen.style.display = "none";
    mainScreen.style.display = "block";
  }

  function showLock(msg) {
    mainScreen.style.display = "none";
    lockScreen.style.display = "block";
    lockError.textContent = msg || "";
  }

  async function tryUnlock() {
    const val = pwInput.value.trim();
    if (!val) return;
    TOKEN = val;
    lockError.textContent = "";
    unlockBtn.disabled = true;
    unlockBtn.textContent = "Checking…";
    const ok = await poll("status");
    unlockBtn.disabled = false;
    unlockBtn.textContent = "Continue";
    if (ok) sessionStorage.setItem("mc_pw", TOKEN);
  }

  unlockBtn.addEventListener("click", tryUnlock);
  pwInput.addEventListener("keydown", (e) => { if (e.key === "Enter") tryUnlock(); });
  startBtn.addEventListener("click", () => poll("start"));
  checkBtn.addEventListener("click", () => poll("status"));

  if (TOKEN) {
    poll("status");
  }
</script>
</body>
</html>
